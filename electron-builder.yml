# electron-builder config for OpenMeido.
#
# Output goes to `dist/` (release artifacts) — different from `out/` which
# is electron-vite's build output (the JS bundles we then package here).
#
# Native modules (better-sqlite3, sqlite-vec) need to ship their .node
# binaries; asar can hold them but Node native loaders need on-disk access,
# so we asarUnpack them. @huggingface/transformers is pure JS + WASM and
# loads fine from inside asar.
#
# The bge-small-zh-v1.5 model (~95MB) is NOT bundled (v0.0.14+). After
# v0.0.13 shipped with it bundled and inflated the installer to 444MB,
# we switched to an in-app download flow:
#   - First launch: app starts in "naive memory mode" (no embeddings).
#     User can chat immediately; only L2 semantic recall is disabled.
#   - A banner in chat prompts: "下载嵌入模型 (95MB) 启用长期记忆".
#   - User clicks → embed-download-host fetches from huggingface.co
#     (or hf-mirror.com fallback) into <userData>/hf-cache.
#   - When done, memory-host.exitNaiveMemoryMode() flips the mode flag
#     without needing a restart.
# Trade-off: optional 95MB download vs. forcing all users to pay for it
# upfront in the installer. Net better for the China audience where
# slow downloads of large installers are the bigger pain.

appId: com.openmeido.app
productName: OpenMeido
copyright: Copyright © 2026 OpenMeido

# Auto-update source — the released installer reads GitHub Releases to
# detect new versions. Public repo means no GH_TOKEN needed at update
# time; users running v0.1.6+ will find updates automatically.
#
# How it works:
#   - On every `npm run dist`, electron-builder writes `latest.yml` next
#     to the .exe with version + SHA. Uploading it alongside the .exe
#     on the GitHub release lets electron-updater fetch + compare.
#   - The .blockmap (already being uploaded) enables delta updates so
#     users with a prior version only download the changed chunks.
#   - electron-updater handles the rest: download in background, verify
#     signature, prompt restart via our updater-host IPC.
#
# Note: existing users on v0.1.5 and earlier do NOT have updater code,
# so they must manually install v0.1.6 once. From then on, automatic.
publish:
  provider: github
  owner: lshhhhhhh
  repo: OpenMeido

# Build artifacts directory. dist/ is gitignored.
directories:
  output: dist
  buildResources: build

# Asar packaging on. Faster startup, simpler distribution, and the bundle
# gets a basic obfuscation against casual prying.
asar: true
asarUnpack:
  # Native .node modules MUST be unpacked — the Node loader needs a real
  # file path. Without this you get "ENOENT" on launch.
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sqlite-vec/**"
  # sqlite-vec ships its actual .dll / .so / .dylib in a PLATFORM SUBPACKAGE
  # (sqlite-vec-windows-x64, sqlite-vec-linux-x64, etc.) referenced via
  # import.meta.resolve. better-sqlite3.loadExtension() does a real dlopen
  # which cannot read from inside the asar virtual fs — without unpacking
  # the platform package, prod builds fail with "Cannot find module ...vec0.dll"
  # and the memory module won't initialize.
  - "**/node_modules/sqlite-vec-*/**"
  - "**/node_modules/@huggingface/transformers/.cache/**"

# Tell electron-builder which files end up in the .asar. electron-vite has
# already built the main + preload + renderer bundles into out/, so we
# only ship those plus the package.json (resolves prod deps).
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**/{CHANGELOG.md,README.md,LICENSE*,readme.md,license,*.d.ts.map,*.js.map}"
  - "!**/node_modules/*/{test,tests,docs,doc,example,examples,benchmark}"
  - "!**/{.DS_Store,.git*,.editorconfig,.eslintrc,.prettierrc}"
  # onnxruntime-node ships binaries for ALL platforms (darwin/linux/win32)
  # plus optional GPU providers. We're a Windows-only build doing CPU
  # inference via transformers.js → the macOS/Linux .dylib/.so and the
  # DirectML GPU stack are dead weight. Cutting them takes the installer
  # from 400MB → ~210MB without touching any feature.
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  # win32/arm64 — we only ship x64 builds. arm64 binaries are 65MB dead weight.
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll"
  - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll"

# Files shipped alongside the asar (NOT compressed into it). PowerShell
# can't read files inside app.asar — the .ps1 listener lives next to the
# asar as <resourcesPath>/notif-listener.ps1. Live2D files have the same
# constraint: the renderer fetches them via the custom meido-live2d://
# protocol which resolves to disk paths.
#
# `haitu_vts/` is a paid Live2D model with a personal-use license — keep
# it out of public builds. Local dev builds still pick it up because
# `src/renderer/public/live2d-models/haitu_vts/` exists on the developer's
# disk (gitignored), but this filter scrubs it from the redistributable.
extraResources:
  - from: src/main/notif-listener.ps1
    to: notif-listener.ps1
  - from: src/renderer/public
    to: public
    filter:
      - "**/*"
      - "!live2d-models/haitu_vts/**"
  # App icon — shipped OUTSIDE the asar so BrowserWindow's `icon`
  # option can read a real file path at runtime (taskbar / Alt-Tab /
  # window icon). electron-builder also auto-embeds build/icon.png
  # into the .exe metadata as the executable's icon for File Explorer
  # / installer — that path is detected from buildResources, this
  # extraResources copy is just for the BrowserWindow runtime use.
  - from: build/icon.png
    to: build/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  # If you sign the build, set CSC_LINK + CSC_KEY_PASSWORD env vars; otherwise
  # unsigned binaries trigger SmartScreen warnings on first launch.
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenMeido

# macOS build target — leave commented unless we actually start shipping
# to Mac. Code signing for macOS requires Apple Developer ID + notarization,
# which is paid + complicated.
# mac:
#   target: dmg
#   category: public.app-category.productivity
