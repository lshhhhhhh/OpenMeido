<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OpenMeido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cubism Core SDK — proprietary, no npm package. Must load BEFORE
         pixi-live2d-display imports run, so it goes here, not in a module. -->
    <script src="/live2d-core/live2dcubismcore.min.js"></script>
    <style>
      /* The Electron BrowserWindow is { transparent: true, frame: false }.
         Browsers default body/html to white — clear them so the desktop
         shows through everywhere we don't explicitly paint. */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* Native <option> doesn't inherit color/background from the parent
         <select> on most platforms — the OS draws the popup. Force dark on
         every option so dropdowns inside the Settings modal stay readable. */
      option {
        background: #1e1f29;
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
