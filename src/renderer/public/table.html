<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>报表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #1e1f29;
      --panel: #262732;
      --border: #3a3b48;
      --text: #e8e8ee;
      --muted: #888;
      --accent: #7ab8ff;
      --header-bg: #2d2e3c;
      --tab-bg: #20212c;
      --tab-active-bg: #2d2e3c;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #tabbar {
      display: none;
      flex: 0 0 auto;
      background: var(--tab-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 6px;
      overflow-x: auto;
      white-space: nowrap;
    }
    #tabbar.show { display: block; }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 240px;
      padding: 8px 10px;
      border-right: 1px solid var(--border);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.025); }
    .tab.active {
      color: var(--text);
      background: var(--tab-active-bg);
      border-bottom-color: var(--accent);
    }
    .tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .tab-close {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      line-height: 14px;
      text-align: center;
      border-radius: 50%;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: var(--text);
    }
    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-left: 8px;
      font-weight: normal;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    button.copied { color: #7c7; border-color: #7c7; }
    .table-wrap {
      flex: 1;
      overflow: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }
    thead {
      position: sticky;
      top: 0;
      background: var(--header-bg);
      z-index: 1;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      line-height: 1.5;
      max-width: 380px;
      word-break: break-word;
    }
    tr:nth-child(even) td {
      background: rgba(255,255,255,0.015);
    }
    tr:hover td {
      background: rgba(122,184,255,0.05);
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="tabbar"></div>
  <header>
    <div>
      <h1 id="title">报表</h1>
      <span id="meta" class="meta"></span>
    </div>
    <div class="actions">
      <button id="copy" title="复制为 TSV（粘到 Excel / 表格）">📋 复制</button>
      <button id="csv" title="下载为 CSV 文件">💾 CSV</button>
    </div>
  </header>
  <div class="table-wrap">
    <table id="tbl">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">没有可显示的数据。</div>
  </div>

<script>
  /**
   * Multi-tab vanilla renderer. Receives data via URL hash:
   *   #data=<base64-encoded JSON of {tabs: [{title, columns, rows}], activeIndex?}>
   *
   * Backward compat: a bare {title, columns, rows} (no tabs key) is
   * still accepted and rendered as a single-tab bundle.
   */

  let tabs = []
  let activeIndex = 0

  function decodeData() {
    const hash = window.location.hash || ''
    const m = hash.match(/data=([^&]+)/)
    if (!m) return null
    try {
      const json = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))
      return JSON.parse(json)
    } catch (err) {
      console.error('decode failed:', err)
      return null
    }
  }

  function normalize(raw) {
    if (!raw) return { tabs: [], activeIndex: 0 }
    if (Array.isArray(raw.tabs)) {
      const idx = typeof raw.activeIndex === 'number' ? raw.activeIndex : raw.tabs.length - 1
      return { tabs: raw.tabs, activeIndex: Math.max(0, Math.min(idx, raw.tabs.length - 1)) }
    }
    if (Array.isArray(raw.columns) && Array.isArray(raw.rows)) {
      return { tabs: [raw], activeIndex: 0 }
    }
    return { tabs: [], activeIndex: 0 }
  }

  function renderTabBar() {
    const bar = document.getElementById('tabbar')
    bar.innerHTML = ''
    if (tabs.length < 2) {
      bar.classList.remove('show')
      return
    }
    bar.classList.add('show')
    tabs.forEach((t, i) => {
      const el = document.createElement('div')
      el.className = 'tab' + (i === activeIndex ? ' active' : '')
      el.title = t.title || '报表'
      const label = document.createElement('span')
      label.className = 'tab-label'
      label.textContent = t.title || `表 ${i + 1}`
      const close = document.createElement('span')
      close.className = 'tab-close'
      close.textContent = '×'
      close.title = '关闭这个 tab'
      close.addEventListener('click', (e) => {
        e.stopPropagation()
        closeTab(i)
      })
      el.appendChild(label)
      el.appendChild(close)
      el.addEventListener('click', () => switchTo(i))
      bar.appendChild(el)
    })
  }

  function renderActive() {
    const empty = document.getElementById('empty')
    const tbl = document.getElementById('tbl')
    const theadRow = document.getElementById('thead-row')
    const tbody = document.getElementById('tbody')
    theadRow.innerHTML = ''
    tbody.innerHTML = ''
    empty.style.display = 'none'
    tbl.style.display = ''

    const data = tabs[activeIndex]
    if (!data || !Array.isArray(data.columns) || !Array.isArray(data.rows)) {
      empty.style.display = 'block'
      tbl.style.display = 'none'
      document.getElementById('title').textContent = '报表'
      document.getElementById('meta').textContent = ''
      document.title = '报表'
      return
    }
    document.title = data.title ? `报表: ${data.title}` : '报表'
    document.getElementById('title').textContent = data.title || '报表'
    document.getElementById('meta').textContent = `${data.rows.length} 行 · ${data.columns.length} 列`

    for (const col of data.columns) {
      const th = document.createElement('th')
      th.textContent = col
      theadRow.appendChild(th)
    }
    // rows is an array-of-arrays — purely positional. row[i] corresponds
    // to columns[i]. See chat.ts presentTable for why this is the contract.
    for (const row of data.rows) {
      const tr = document.createElement('tr')
      for (let i = 0; i < data.columns.length; i++) {
        const td = document.createElement('td')
        const v = Array.isArray(row) ? row[i] : undefined
        td.textContent =
          v === undefined || v === null || v === ''
            ? '—'
            : typeof v === 'object'
              ? JSON.stringify(v)
              : String(v)
        tr.appendChild(td)
      }
      tbody.appendChild(tr)
    }
  }

  function switchTo(i) {
    if (i < 0 || i >= tabs.length) return
    activeIndex = i
    renderTabBar()
    renderActive()
  }

  function closeTab(i) {
    if (tabs.length <= 1) {
      // Last tab — close the whole window. Leaving an empty report
      // open is worse UX than just dismissing the window.
      window.close()
      return
    }
    tabs.splice(i, 1)
    if (activeIndex >= tabs.length) activeIndex = tabs.length - 1
    else if (activeIndex > i) activeIndex -= 1
    renderTabBar()
    renderActive()
  }

  function toTSV(data) {
    const head = data.columns.join('\t')
    const body = data.rows
      .map((r) =>
        data.columns
          .map((_, i) => {
            const v = Array.isArray(r) ? r[i] : undefined
            const s = v === undefined || v === null ? '' : String(v)
            return s.replace(/\t/g, ' ').replace(/\r?\n/g, ' ')
          })
          .join('\t'),
      )
      .join('\n')
    return head + '\n' + body
  }

  function toCSV(data) {
    const esc = (v) => {
      const s = v === undefined || v === null ? '' : String(v)
      if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"'
      return s
    }
    const head = data.columns.map(esc).join(',')
    const body = data.rows
      .map((r) =>
        data.columns
          .map((_, i) => {
            const v = Array.isArray(r) ? r[i] : undefined
            return esc(v)
          })
          .join(','),
      )
      .join('\n')
    return head + '\n' + body
  }

  function download(filename, content) {
    const blob = new Blob(['﻿' + content], { type: 'text/csv;charset=utf-8' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = filename
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    URL.revokeObjectURL(url)
  }

  function safeFilename(s) {
    return (s || 'report').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60)
  }

  function fullRender() {
    const decoded = decodeData()
    const bundle = normalize(decoded)
    tabs = bundle.tabs
    activeIndex = bundle.activeIndex
    renderTabBar()
    renderActive()
  }
  fullRender()
  window.addEventListener('hashchange', () => {
    console.log('[table.html] hashchange — re-rendering')
    fullRender()
  })

  document.getElementById('copy').addEventListener('click', async (e) => {
    const data = tabs[activeIndex]
    if (!data) return
    try {
      await navigator.clipboard.writeText(toTSV(data))
      const btn = e.currentTarget
      const orig = btn.textContent
      btn.classList.add('copied')
      btn.textContent = '✓ 已复制'
      setTimeout(() => {
        btn.classList.remove('copied')
        btn.textContent = orig
      }, 1500)
    } catch (err) {
      console.error('copy failed:', err)
    }
  })

  document.getElementById('csv').addEventListener('click', () => {
    const data = tabs[activeIndex]
    if (!data) return
    download(safeFilename(data.title) + '.csv', toCSV(data))
  })

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.close()
    // Ctrl+Tab / Ctrl+Shift+Tab cycle through tabs (when ≥2 exist).
    if (tabs.length >= 2 && e.ctrlKey && e.key === 'Tab') {
      e.preventDefault()
      switchTo(
        e.shiftKey
          ? (activeIndex - 1 + tabs.length) % tabs.length
          : (activeIndex + 1) % tabs.length,
      )
    }
  })
</script>
</body>
</html>
